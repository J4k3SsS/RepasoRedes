<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio CLI CNOC</title>
<meta name="description" content="Consola simulada Huawei, Cisco y FortiGate para practicar diagnóstico de N1 con escenarios ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F3F6F4; --fg:#13211C; --muted:#586861; --line:#CBD6D1;
  --accent:#0B7A63; --accent-fg:#FFFFFF; --ok:#17884A; --okbg:#E2F4E9; --bad:#C23B2E; --badbg:#FBE7E4; --warn:#A86A0B;
  --term:#0C1210; --termfg:#D7E4DD; --termmuted:#7F948A; --termok:#55E0A6; --termbad:#FF8A7D; --termwarn:#F2C266; --termcmd:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201B; --surface2:#1C2822; --fg:#E3EDE8; --muted:#93A49C; --line:#2B3A33;
    --accent:#3FD6A0; --accent-fg:#08110D; --ok:#3FD6A0; --okbg:#123226; --bad:#FF7366; --badbg:#3A1A17; --warn:#E8B04B;
    --term:#070B09; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface2:#1C2822; --fg:#E3EDE8; --muted:#93A49C; --line:#2B3A33;
  --accent:#3FD6A0; --accent-fg:#08110D; --ok:#3FD6A0; --okbg:#123226; --bad:#FF7366; --badbg:#3A1A17; --warn:#E8B04B;
  --term:#070B09; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:0;font-size:15px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:12px}
.leds{display:flex;gap:5px}.leds i{width:10px;height:10px;border-radius:2px;background:var(--ok)}
.leds i:nth-child(2){background:var(--warn)}.leds i:nth-child(3){background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sc{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-width:0}
.sc .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sc strong{font-size:16px;line-height:1.3}
.sc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.ticket{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.ticket p{margin:0;font-size:15.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tab small{font-family:var(--body);font-size:11px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.75}
.term{background:var(--term);color:var(--termfg);border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.out{font-family:var(--mono);font-size:12.5px;line-height:1.5;height:52vh;min-height:300px;overflow:auto;padding:12px 12px 4px;white-space:pre;-webkit-overflow-scrolling:touch}
.out .cmd{color:var(--termcmd)}.out .lab{color:var(--termwarn);white-space:pre-wrap}.out .err{color:var(--termbad)}
.out .ban{color:var(--termok)}.out .hint{color:var(--termwarn);white-space:pre-wrap}.out .dim{color:var(--termmuted);white-space:pre-wrap}
.out .info{color:#8FD3FF;white-space:pre-wrap;border-left:2px solid #2F5F78;padding-left:8px;margin:4px 0 8px}
.sc.free{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.sc.free .n{color:inherit;opacity:.8}
.inrow{display:flex;align-items:center;gap:8px;border-top:1px solid #22302A;padding:8px 10px}
.prompt{font-family:var(--mono);font-size:13px;color:var(--termok);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inrow input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--termcmd);font-family:var(--mono);font-size:16px;padding:6px 0}
.send{flex:none;background:var(--termok);color:#08110D;border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.keys{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.key{background:#17221D;color:var(--termfg);border:1px solid #2A3A33;border-radius:6px;padding:7px 11px;font-family:var(--mono);font-size:13px;cursor:pointer;min-width:42px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:13px 16px;font-weight:600;cursor:pointer;text-align:center;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}
.q{font-size:18px;font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:15.5px;line-height:1.35;cursor:pointer}
.opt .port{flex:none;width:10px;height:10px;margin-top:6px;border-radius:2px;background:var(--line)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .port{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .port{background:var(--bad)}
.opt.dim{opacity:.6}.opt[aria-disabled="true"]{cursor:default}
.fb{border-radius:8px;padding:14px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b.t{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.fb p{margin:0;font-size:15px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .mk{flex:none;font-family:var(--mono);font-weight:500;width:18px}
.checks .y{color:var(--ok)}.checks .n2{color:var(--bad)}
.foot{color:var(--muted);font-size:13px}
@media (max-width:420px){.out{font-size:11.5px;height:50vh}h1{font-size:32px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
/* =================== Utilidades de salida =================== */
const ciNbr = rows => "\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n" + rows.join("\n");
const hwPeer = (rid, rows) => "\n         OSPF Process 1 with Router ID " + rid + "\n                  Peer Statistic Information\n ----------------------------------------------------------------------------\n Area Id          Interface                        Neighbor id      State\n" + rows.map(r=>" "+r).join("\n") + (rows.length?"\n":"") + " ----------------------------------------------------------------------------";
const hwRT = (title, rows) => "Route Flags: R - relay, D - download to fib\n------------------------------------------------------------------------------\nRouting Table : " + title + "\n         Destinations : " + rows.length + "        Routes : " + rows.length + "\n\nDestination/Mask    Proto   Pre  Cost      Flags NextHop         Interface\n\n" + rows.join("\n");
const hwIfBriefHead = "PHY: Physical\n*down: administratively down\n(l): loopback\n(s): spoofing\nInUti/OutUti: input utility/output utility\nInterface                   PHY   Protocol  InUti OutUti   inErrors  outErrors\n";
const hwOspfIf = (rid, ip, ifn, cost, mtu, hello, dead) => "\n          OSPF Process 1 with Router ID " + rid + "\n                  Interfaces\n\n Interface: " + ip + " (" + ifn + ")\n Cost: " + cost + "       State: P-2-P      Type: P2P       MTU: " + mtu + "\n Timers: Hello " + hello + " , Dead " + dead + " , Poll  120 , Retransmit 5 , Transmit Delay 1";
const hwOspfBrief = rid => "\n         OSPF Process 1 with Router ID " + rid + "\n                 OSPF Protocol Information\n\n RouterID: " + rid + "         Border Router:\n Multi-VPN-Instance is not enabled\n Spf-schedule-interval: max 10000ms, start 500ms, hold 1000ms\n Default ASE parameters: Metric: 1 Tag: 1 Type: 2\n Route Preference: 10\n ASE Route Preference: 150\n Bandwidth-reference: 100000 (Mbps)\n Area Count: 1   Nssa Area Count: 0\n\n Area: 0.0.0.0          (MPLS TE not enabled)\n Authtype: None   Area flag: Normal";
const ciOspf = ref => " Routing Process \"ospf 1\" with ID 10.255.0.1\n Start time: 00:00:41.112, Time elapsed: 3d04h\n Supports only single TOS(TOS0) routes\n Router is not originating router-LSAs with maximum metric\n Initial SPF schedule delay 50 msecs\n Number of areas in this router is 1. 1 normal 0 stub 0 nssa\n Reference bandwidth unit is " + ref + " mbps\n    Area BACKBONE(0)\n        Number of interfaces in this area is 4 (1 loopback)\n        Area has no authentication\n        SPF algorithm executed 14 times";
const ciIf = (name, desc, ip, mtu, extra) => name + " is up, line protocol is up\n  Hardware is BUILT-IN-2T+20X1GE, address is 00aa.bb01.0002 (bia 00aa.bb01.0002)\n  Description: " + desc + "\n  Internet address is " + ip + "\n  MTU " + mtu + " bytes, BW 10000000 Kbit/sec, DLY 10 usec,\n     reliability 255/255, txload 1/255, rxload 1/255\n  Encapsulation ARPA, loopback not set\n  Full Duplex, 10000Mbps, link type is force-up, media type is SFP-10GBase-LR\n  Last input 00:00:00, output 00:00:00, output hang never\n  5 minute input rate 12000 bits/sec, 15 packets/sec\n  5 minute output rate 14000 bits/sec, 16 packets/sec\n     0 input errors, 0 CRC, 0 frame, 0 overrun, 0 ignored\n     0 output errors, 0 collisions, " + (extra||"0") + " interface resets";
const ciIpBrief = "Interface              IP-Address      OK? Method Status                Protocol\nTenGigabitEthernet0/0/1 10.0.0.0       YES NVRAM  up                    up\nTenGigabitEthernet0/0/2 10.0.0.2       YES NVRAM  up                    up\nTenGigabitEthernet0/0/3 10.0.0.6       YES NVRAM  up                    up\nLoopback0              10.255.0.1      YES NVRAM  up                    up";
const ciOspfIf = (name, ip, nb, adj) => name + " is up, line protocol is up\n  Internet Address " + ip + ", Area 0, Attached via Network Statement\n  Process ID 1, Router ID 10.255.0.1, Network Type POINT_TO_POINT, Cost: 10\n  Transmit Delay is 1 sec, State POINT_TO_POINT\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    Hello due in 00:00:04\n  Neighbor Count is " + nb + ", Adjacent neighbor count is " + adj + "\n  Suppress hello for 0 neighbor(s)";
const ciRunIf = (name, desc, ip) => "Building configuration...\n\nCurrent configuration : 188 bytes\n!\ninterface " + name + "\n description " + desc + "\n ip address " + ip + " 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\nend";

const ciPcenRun = "Building configuration...\n\nCurrent configuration : 1412 bytes\n!\nhostname P-CEN-01\n!\ninterface Loopback0\n ip address 10.255.0.1 255.255.255.255\n!\ninterface TenGigabitEthernet0/0/1\n description CORE-A-PE-NOR-01-XGE0/0/1\n ip address 10.0.0.0 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\ninterface TenGigabitEthernet0/0/2\n description CORE-A-PE-SUR-01-XGE0/0/1\n ip address 10.0.0.2 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\ninterface TenGigabitEthernet0/0/3\n description CORE-A-FW-CEN-01-x1\n ip address 10.0.0.6 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\nrouter ospf 1\n router-id 10.255.0.1\n auto-cost reference-bandwidth 100000\n network 10.255.0.1 0.0.0.0 area 0\n network 10.0.0.0 0.0.0.255 area 0\n!\nend";
const hwRun = (name, rid, ifs, nets) => "!Software Version V800R021C10SPC100\n#\n sysname " + name + "\n#\n" + ifs.map(b=>b+"\n#\n").join("") + "interface LoopBack0\n ip address " + rid + " 255.255.255.255\n#\nospf 1 router-id " + rid + "\n bandwidth-reference 100000\n area 0.0.0.0\n  network " + rid + " 0.0.0.0\n" + nets.map(n=>"  network "+n+"\n").join("") + "#\nreturn";

/* =================== Escenarios (todo ficticio) =================== */
const SC = [
{
 id:"ospf-mtu", title:"OSPF: PE-SUR-01 no llega a Full", level:"OSPF",
 ticket:"Alarma de monitoreo: las sesiones BGP hacia PE-SUR-01 se cayeron. El enlace de fibra entre P-CEN-01 y PE-SUR-01 está arriba. Hoy se hizo un cambio programado en PE-SUR-01.",
 goal:"Revisa la vecindad OSPF en los dos extremos y encuentra por qué no se completa.",
 devices:[
  {name:"P-CEN-01", os:"cisco", role:"P · Cisco IOS-XE", vrfs:[],
   pings:[{ip:"10.0.0.3",mtu:1500},{ip:"10.0.0.1",mtu:1500},{ip:"10.0.0.7",mtu:1500},{ip:"10.255.0.11",mtu:1500},{ip:"10.255.0.31",mtu:1500}],
   cmds:[
    {c:["show running-config"], o:ciPcenRun},
    {c:["show ip ospf neighbor"], o:ciNbr(["10.255.0.11       0   FULL/  -        00:00:36    10.0.0.1        TenGigabitEthernet0/0/1","10.255.0.12       0   EXSTART/  -     00:00:37    10.0.0.3        TenGigabitEthernet0/0/2","10.255.0.31       0   FULL/  -        00:00:38    10.0.0.7        TenGigabitEthernet0/0/3"])},
    {c:["show ip ospf interface brief"], o:"Interface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               10.255.0.1/32      1     LOOP  0/0\nTe0/0/1      1     0               10.0.0.0/31        10    P2P   1/1\nTe0/0/2      1     0               10.0.0.2/31        10    P2P   0/1\nTe0/0/3      1     0               10.0.0.6/31        10    P2P   1/1"},
    {c:["show ip ospf interface TenGigabitEthernet0/0/2"], o:ciOspfIf("TenGigabitEthernet0/0/2","10.0.0.2/31",1,0)},
    {c:["show interfaces TenGigabitEthernet0/0/2"], o:ciIf("TenGigabitEthernet0/0/2","CORE-A-PE-SUR-01-XGE0/0/1","10.0.0.2/31",1500)},
    {c:["show interfaces TenGigabitEthernet0/0/1"], o:ciIf("TenGigabitEthernet0/0/1","CORE-A-PE-NOR-01-XGE0/0/1","10.0.0.0/31",1500)},
    {c:["show ip interface brief"], o:ciIpBrief},
    {c:["show ip route ospf"], o:"      10.0.0.0/8 is variably subnetted, 8 subnets, 2 masks\nO        10.255.0.11/32 [110/10] via 10.0.0.1, 3d04h, TenGigabitEthernet0/0/1\nO        10.255.0.31/32 [110/10] via 10.0.0.7, 3d04h, TenGigabitEthernet0/0/3"},
    {c:["show ip route 10.255.0.12"], o:"% Subnet not in table"},
    {c:["show ip ospf"], o:ciOspf(100000)},
    {c:["show running-config interface TenGigabitEthernet0/0/2"], o:ciRunIf("TenGigabitEthernet0/0/2","CORE-A-PE-SUR-01-XGE0/0/1","10.0.0.2")},
    {c:["show logging"], o:"Log Buffer (65536 bytes):\n*Oct 30 14:01:21: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from FULL to DOWN, Neighbor Down: Interface down or detached\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from DOWN to INIT, Received Hello\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from INIT to 2WAY, 2-Way Received\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from 2WAY to EXSTART, AdjOK?\n*Oct 30 14:03:11: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from EXSTART to DOWN, Neighbor Down: Too many retransmissions\n*Oct 30 14:03:14: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from 2WAY to EXSTART, AdjOK?"}
   ]},
  {name:"PE-SUR-01", os:"huawei", role:"PE · Huawei VRP", vrfs:[],
   pings:[{ip:"10.0.0.2",mtu:1500}],
   cmds:[
    {c:["display current-configuration"], o:hwRun("PE-SUR-01","10.255.0.12",["interface XGigabitEthernet0/0/1\n description CORE-A-P-CEN-01-Te0/0/2\n mtu 1600\n ip address 10.0.0.3 255.255.255.254\n ospf network-type p2p\n ospf cost 10","interface GigabitEthernet0/0/3\n description CLIENTE-0403-FIBRA\n ip address 100.64.30.1 255.255.255.252"],["10.0.0.2 0.0.0.1"])},
    {c:["display ospf peer brief"], o:hwPeer("10.255.0.12",["0.0.0.0          XGigabitEthernet0/0/1            10.255.0.1       ExStart"])},
    {c:["display ospf interface XGigabitEthernet0/0/1"], o:hwOspfIf("10.255.0.12","10.0.0.3","XGigabitEthernet0/0/1",10,1600,10,40)},
    {c:["display interface brief"], o:hwIfBriefHead+"GigabitEthernet0/0/2        up    up        12%    9%            0          0\nGigabitEthernet0/0/3        up    up        4%     2%            0          0\nLoopBack0                   up    up(s)     0%     0%            0          0\nNULL0                       up    up(s)     0%     0%            0          0\nXGigabitEthernet0/0/1       up    up        0.01%  0.01%         0          0"},
    {c:["display interface XGigabitEthernet0/0/1"], o:"XGigabitEthernet0/0/1 current state : UP\nLine protocol current state : UP\nLast line protocol up time : 2026-10-30 14:01:24\nDescription:CORE-A-P-CEN-01-Te0/0/2\nRoute Port,The Maximum Transmit Unit is 1600\nInternet Address is 10.0.0.3/31\nIP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is 00e0-fc12-0001\nPort Mode: COMMON FIBER\nSpeed : 10000,  Loopback: NONE\nDuplex: FULL,   Negotiation: DISABLE\nLast 300 seconds input rate 9840 bits/sec, 12 packets/sec\nLast 300 seconds output rate 11200 bits/sec, 13 packets/sec\nInput:  0 CRC, 0 Giants, 0 Runts\nOutput: 0 errors"},
    {c:["display current-configuration interface XGigabitEthernet0/0/1"], o:"#\ninterface XGigabitEthernet0/0/1\n description CORE-A-P-CEN-01-Te0/0/2\n mtu 1600\n ip address 10.0.0.3 255.255.255.254\n ospf network-type p2p\n ospf cost 10\n#\nreturn"},
    {c:["display ip routing-table protocol ospf"], o:"Route Flags: R - relay, D - download to fib\n------------------------------------------------------------------------------\nPublic routing table : OSPF\n         Destinations : 0        Routes : 0"},

   {c:["display ip routing-table protocol static"],o:"Route Flags: R - relay, D - download to fib\n------------------------------------------------------------------------------\nPublic routing table : Static\n         Destinations : 1        Routes : 1        Configured Routes : 1\n\nStatic routing table status : <Active>\n         Destinations : 1        Routes : 1\n\nDestination/Mask    Proto   Pre  Cost      Flags NextHop         Interface\n\n      0.0.0.0/0     Static  60   0          RD   10.255.0.1      XGigabitEthernet0/0/1",i:I("Solo las rutas estáticas.","Preferencia 60 (o 100 si es flotante). Si una estática configurada no aparece activa, su next-hop no es alcanzable.","Cisco: show ip route static")},
