<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratorio CLI CNOC</title>
<meta name="description" content="Consola simulada Huawei, Cisco y FortiGate para practicar diagnóstico de N1 con escenarios ficticios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F3F6F4; --fg:#13211C; --muted:#586861; --line:#CBD6D1;
  --accent:#0B7A63; --accent-fg:#FFFFFF; --ok:#17884A; --okbg:#E2F4E9; --bad:#C23B2E; --badbg:#FBE7E4; --warn:#A86A0B;
  --term:#0C1210; --termfg:#D7E4DD; --termmuted:#7F948A; --termok:#55E0A6; --termbad:#FF8A7D; --termwarn:#F2C266; --termcmd:#FFFFFF;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#16201B; --surface2:#1C2822; --fg:#E3EDE8; --muted:#93A49C; --line:#2B3A33;
    --accent:#3FD6A0; --accent-fg:#08110D; --ok:#3FD6A0; --okbg:#123226; --bad:#FF7366; --badbg:#3A1A17; --warn:#E8B04B;
    --term:#070B09; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#16201B; --surface2:#1C2822; --fg:#E3EDE8; --muted:#93A49C; --line:#2B3A33;
  --accent:#3FD6A0; --accent-fg:#08110D; --ok:#3FD6A0; --okbg:#123226; --bad:#FF7366; --badbg:#3A1A17; --warn:#E8B04B;
  --term:#070B09; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
.app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px;min-width:0}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.86em;background:var(--surface2);border:1px solid var(--line);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
h1{font-family:var(--display);font-weight:700;font-size:38px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1.1}
.sub{color:var(--muted);margin:0;font-size:15px}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:12px}
.leds{display:flex;gap:5px}.leds i{width:10px;height:10px;border-radius:2px;background:var(--ok)}
.leds i:nth-child(2){background:var(--warn)}.leds i:nth-child(3){background:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.sc{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;min-width:0}
.sc .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sc strong{font-size:16px;line-height:1.3}
.sc .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.link{background:none;border:0;padding:6px 0;color:var(--muted);cursor:pointer;font-size:15px;text-decoration:underline;text-underline-offset:3px}
.ticket{border-left:3px solid var(--accent);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:6px}
.ticket p{margin:0;font-size:15.5px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-family:var(--mono);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.tab small{font-family:var(--body);font-size:11px;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tab[aria-pressed="true"] small{color:inherit;opacity:.75}
.term{background:var(--term);color:var(--termfg);border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.out{font-family:var(--mono);font-size:12.5px;line-height:1.5;height:52vh;min-height:300px;overflow:auto;padding:12px 12px 4px;white-space:pre;-webkit-overflow-scrolling:touch}
.out .cmd{color:var(--termcmd)}.out .lab{color:var(--termwarn);white-space:pre-wrap}.out .err{color:var(--termbad)}
.out .ban{color:var(--termok)}.out .hint{color:var(--termwarn);white-space:pre-wrap}.out .dim{color:var(--termmuted);white-space:pre-wrap}
.out .info{color:#8FD3FF;white-space:pre-wrap;border-left:2px solid #2F5F78;padding-left:8px;margin:4px 0 8px}
.sc.free{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}.sc.free .n{color:inherit;opacity:.8}
.inrow{display:flex;align-items:center;gap:8px;border-top:1px solid #22302A;padding:8px 10px}
.prompt{font-family:var(--mono);font-size:13px;color:var(--termok);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inrow input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--termcmd);font-family:var(--mono);font-size:16px;padding:6px 0}
.send{flex:none;background:var(--termok);color:#08110D;border:0;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer}
.keys{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}
.key{background:#17221D;color:var(--termfg);border:1px solid #2A3A33;border-radius:6px;padding:7px 11px;font-family:var(--mono);font-size:13px;cursor:pointer;min-width:42px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:13px 16px;font-weight:600;cursor:pointer;text-align:center;min-height:48px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}
.q{font-size:18px;font-weight:500;margin:0}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:15.5px;line-height:1.35;cursor:pointer}
.opt .port{flex:none;width:10px;height:10px;margin-top:6px;border-radius:2px;background:var(--line)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .port{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}.opt.bad .port{background:var(--bad)}
.opt.dim{opacity:.6}.opt[aria-disabled="true"]{cursor:default}
.fb{border-radius:8px;padding:14px;border:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.fb.ok{border-color:var(--ok);background:var(--okbg)}.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b.t{font-family:var(--display);font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.fb p{margin:0;font-size:15px}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.checks li{display:flex;gap:8px;align-items:flex-start}
.checks .mk{flex:none;font-family:var(--mono);font-weight:500;width:18px}
.checks .y{color:var(--ok)}.checks .n2{color:var(--bad)}
.foot{color:var(--muted);font-size:13px}
@media (max-width:420px){.out{font-size:11.5px;height:50vh}h1{font-size:32px}}
</style>
</head>
<body>
<main class="app" id="app"></main>
<script>
/* =================== Utilidades de salida =================== */
const ciNbr = rows => "\nNeighbor ID     Pri   State           Dead Time   Address         Interface\n" + rows.join("\n");
const hwPeer = (rid, rows) => "\n         OSPF Process 1 with Router ID " + rid + "\n                  Peer Statistic Information\n ----------------------------------------------------------------------------\n Area Id          Interface                        Neighbor id      State\n" + rows.map(r=>" "+r).join("\n") + (rows.length?"\n":"") + " ----------------------------------------------------------------------------";
const hwRT = (title, rows) => "Route Flags: R - relay, D - download to fib\n------------------------------------------------------------------------------\nRouting Table : " + title + "\n         Destinations : " + rows.length + "        Routes : " + rows.length + "\n\nDestination/Mask    Proto   Pre  Cost      Flags NextHop         Interface\n\n" + rows.join("\n");
const hwIfBriefHead = "PHY: Physical\n*down: administratively down\n(l): loopback\n(s): spoofing\nInUti/OutUti: input utility/output utility\nInterface                   PHY   Protocol  InUti OutUti   inErrors  outErrors\n";
const hwOspfIf = (rid, ip, ifn, cost, mtu, hello, dead) => "\n          OSPF Process 1 with Router ID " + rid + "\n                  Interfaces\n\n Interface: " + ip + " (" + ifn + ")\n Cost: " + cost + "       State: P-2-P      Type: P2P       MTU: " + mtu + "\n Timers: Hello " + hello + " , Dead " + dead + " , Poll  120 , Retransmit 5 , Transmit Delay 1";
const hwOspfBrief = rid => "\n         OSPF Process 1 with Router ID " + rid + "\n                 OSPF Protocol Information\n\n RouterID: " + rid + "         Border Router:\n Multi-VPN-Instance is not enabled\n Spf-schedule-interval: max 10000ms, start 500ms, hold 1000ms\n Default ASE parameters: Metric: 1 Tag: 1 Type: 2\n Route Preference: 10\n ASE Route Preference: 150\n Bandwidth-reference: 100000 (Mbps)\n Area Count: 1   Nssa Area Count: 0\n\n Area: 0.0.0.0          (MPLS TE not enabled)\n Authtype: None   Area flag: Normal";
const ciOspf = ref => " Routing Process \"ospf 1\" with ID 10.255.0.1\n Start time: 00:00:41.112, Time elapsed: 3d04h\n Supports only single TOS(TOS0) routes\n Router is not originating router-LSAs with maximum metric\n Initial SPF schedule delay 50 msecs\n Number of areas in this router is 1. 1 normal 0 stub 0 nssa\n Reference bandwidth unit is " + ref + " mbps\n    Area BACKBONE(0)\n        Number of interfaces in this area is 4 (1 loopback)\n        Area has no authentication\n        SPF algorithm executed 14 times";
const ciIf = (name, desc, ip, mtu, extra) => name + " is up, line protocol is up\n  Hardware is BUILT-IN-2T+20X1GE, address is 00aa.bb01.0002 (bia 00aa.bb01.0002)\n  Description: " + desc + "\n  Internet address is " + ip + "\n  MTU " + mtu + " bytes, BW 10000000 Kbit/sec, DLY 10 usec,\n     reliability 255/255, txload 1/255, rxload 1/255\n  Encapsulation ARPA, loopback not set\n  Full Duplex, 10000Mbps, link type is force-up, media type is SFP-10GBase-LR\n  Last input 00:00:00, output 00:00:00, output hang never\n  5 minute input rate 12000 bits/sec, 15 packets/sec\n  5 minute output rate 14000 bits/sec, 16 packets/sec\n     0 input errors, 0 CRC, 0 frame, 0 overrun, 0 ignored\n     0 output errors, 0 collisions, " + (extra||"0") + " interface resets";
const ciIpBrief = "Interface              IP-Address      OK? Method Status                Protocol\nTenGigabitEthernet0/0/1 10.0.0.0       YES NVRAM  up                    up\nTenGigabitEthernet0/0/2 10.0.0.2       YES NVRAM  up                    up\nTenGigabitEthernet0/0/3 10.0.0.6       YES NVRAM  up                    up\nLoopback0              10.255.0.1      YES NVRAM  up                    up";
const ciOspfIf = (name, ip, nb, adj) => name + " is up, line protocol is up\n  Internet Address " + ip + ", Area 0, Attached via Network Statement\n  Process ID 1, Router ID 10.255.0.1, Network Type POINT_TO_POINT, Cost: 10\n  Transmit Delay is 1 sec, State POINT_TO_POINT\n  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5\n    Hello due in 00:00:04\n  Neighbor Count is " + nb + ", Adjacent neighbor count is " + adj + "\n  Suppress hello for 0 neighbor(s)";
const ciRunIf = (name, desc, ip) => "Building configuration...\n\nCurrent configuration : 188 bytes\n!\ninterface " + name + "\n description " + desc + "\n ip address " + ip + " 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\nend";

const ciPcenRun = "Building configuration...\n\nCurrent configuration : 1412 bytes\n!\nhostname P-CEN-01\n!\ninterface Loopback0\n ip address 10.255.0.1 255.255.255.255\n!\ninterface TenGigabitEthernet0/0/1\n description CORE-A-PE-NOR-01-XGE0/0/1\n ip address 10.0.0.0 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\ninterface TenGigabitEthernet0/0/2\n description CORE-A-PE-SUR-01-XGE0/0/1\n ip address 10.0.0.2 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\ninterface TenGigabitEthernet0/0/3\n description CORE-A-FW-CEN-01-x1\n ip address 10.0.0.6 255.255.255.254\n ip ospf network point-to-point\n ip ospf cost 10\n!\nrouter ospf 1\n router-id 10.255.0.1\n auto-cost reference-bandwidth 100000\n network 10.255.0.1 0.0.0.0 area 0\n network 10.0.0.0 0.0.0.255 area 0\n!\nend";
const hwRun = (name, rid, ifs, nets) => "!Software Version V800R021C10SPC100\n#\n sysname " + name + "\n#\n" + ifs.map(b=>b+"\n#\n").join("") + "interface LoopBack0\n ip address " + rid + " 255.255.255.255\n#\nospf 1 router-id " + rid + "\n bandwidth-reference 100000\n area 0.0.0.0\n  network " + rid + " 0.0.0.0\n" + nets.map(n=>"  network "+n+"\n").join("") + "#\nreturn";

/* =================== Escenarios (todo ficticio) =================== */
const SC = [
{
 id:"ospf-mtu", title:"OSPF: PE-SUR-01 no llega a Full", level:"OSPF",
 ticket:"Alarma de monitoreo: las sesiones BGP hacia PE-SUR-01 se cayeron. El enlace de fibra entre P-CEN-01 y PE-SUR-01 está arriba. Hoy se hizo un cambio programado en PE-SUR-01.",
 goal:"Revisa la vecindad OSPF en los dos extremos y encuentra por qué no se completa.",
 devices:[
  {name:"P-CEN-01", os:"cisco", role:"P · Cisco IOS-XE", vrfs:[],
   pings:[{ip:"10.0.0.3",mtu:1500},{ip:"10.0.0.1",mtu:1500},{ip:"10.0.0.7",mtu:1500},{ip:"10.255.0.11",mtu:1500},{ip:"10.255.0.31",mtu:1500}],
   cmds:[
    {c:["show running-config"], o:ciPcenRun},
    {c:["show ip ospf neighbor"], o:ciNbr(["10.255.0.11       0   FULL/  -        00:00:36    10.0.0.1        TenGigabitEthernet0/0/1","10.255.0.12       0   EXSTART/  -     00:00:37    10.0.0.3        TenGigabitEthernet0/0/2","10.255.0.31       0   FULL/  -        00:00:38    10.0.0.7        TenGigabitEthernet0/0/3"])},
    {c:["show ip ospf interface brief"], o:"Interface    PID   Area            IP Address/Mask    Cost  State Nbrs F/C\nLo0          1     0               10.255.0.1/32      1     LOOP  0/0\nTe0/0/1      1     0               10.0.0.0/31        10    P2P   1/1\nTe0/0/2      1     0               10.0.0.2/31        10    P2P   0/1\nTe0/0/3      1     0               10.0.0.6/31        10    P2P   1/1"},
    {c:["show ip ospf interface TenGigabitEthernet0/0/2"], o:ciOspfIf("TenGigabitEthernet0/0/2","10.0.0.2/31",1,0)},
    {c:["show interfaces TenGigabitEthernet0/0/2"], o:ciIf("TenGigabitEthernet0/0/2","CORE-A-PE-SUR-01-XGE0/0/1","10.0.0.2/31",1500)},
    {c:["show interfaces TenGigabitEthernet0/0/1"], o:ciIf("TenGigabitEthernet0/0/1","CORE-A-PE-NOR-01-XGE0/0/1","10.0.0.0/31",1500)},
    {c:["show ip interface brief"], o:ciIpBrief},
    {c:["show ip route ospf"], o:"      10.0.0.0/8 is variably subnetted, 8 subnets, 2 masks\nO        10.255.0.11/32 [110/10] via 10.0.0.1, 3d04h, TenGigabitEthernet0/0/1\nO        10.255.0.31/32 [110/10] via 10.0.0.7, 3d04h, TenGigabitEthernet0/0/3"},
    {c:["show ip route 10.255.0.12"], o:"% Subnet not in table"},
    {c:["show ip ospf"], o:ciOspf(100000)},
    {c:["show running-config interface TenGigabitEthernet0/0/2"], o:ciRunIf("TenGigabitEthernet0/0/2","CORE-A-PE-SUR-01-XGE0/0/1","10.0.0.2")},
    {c:["show logging"], o:"Log Buffer (65536 bytes):\n*Oct 30 14:01:21: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from FULL to DOWN, Neighbor Down: Interface down or detached\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from DOWN to INIT, Received Hello\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from INIT to 2WAY, 2-Way Received\n*Oct 30 14:01:24: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from 2WAY to EXSTART, AdjOK?\n*Oct 30 14:03:11: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from EXSTART to DOWN, Neighbor Down: Too many retransmissions\n*Oct 30 14:03:14: %OSPF-5-ADJCHG: Process 1, Nbr 10.255.0.12 on TenGigabitEthernet0/0/2 from 2WAY to EXSTART, AdjOK?"}
   ]},
  {name:"PE-SUR-01", os:"huawei", role:"PE · Huawei VRP", vrfs:[],
   pings:[{ip:"10.0.0.2",mtu:1500}],
   cmds:[
    {c:["display current-configuration"], o:hwRun("PE-SUR-01","10.255.0.12",["interface XGigabitEthernet0/0/1\n description CORE-A-P-CEN-01-Te0/0/2\n mtu 1600\n ip address 10.0.0.3 255.255.255.254\n ospf network-type p2p\n ospf cost 10","interface GigabitEthernet0/0/3\n description CLIENTE-0403-FIBRA\n ip address 100.64.30.1 255.255.255.252"],["10.0.0.2 0.0.0.1"])},
    {c:["display ospf peer brief"], o:hwPeer("10.255.0.12",["0.0.0.0          XGigabitEthernet0/0/1            10.255.0.1       ExStart"])},
    {c:["display ospf interface XGigabitEthernet0/0/1"], o:hwOspfIf("10.255.0.12","10.0.0.3","XGigabitEthernet0/0/1",10,1600,10,40)},
    {c:["display interface brief"], o:hwIfBriefHead+"GigabitEthernet0/0/2        up    up        12%    9%            0          0\nGigabitEthernet0/0/3        up    up        4%     2%            0          0\nLoopBack0                   up    up(s)     0%     0%            0          0\nNULL0                       up    up(s)     0%     0%            0          0\nXGigabitEthernet0/0/1       up    up        0.01%  0.01%         0          0"},
    {c:["display interface XGigabitEthernet0/0/1"], o:"XGigabitEthernet0/0/1 current state : UP\nLine protocol current state : UP\nLast line protocol up time : 2026-10-30 14:01:24\nDescription:CORE-A-P-CEN-01-Te0/0/2\nRoute Port,The Maximum Transmit Unit is 1600\nInternet Address is 10.0.0.3/31\nIP Sending Frames' Format is PKTFMT_ETHNT_2, Hardware address is 00e0-fc12-0001\nPort Mode: COMMON FIBER\nSpeed : 10000,  Loopback: NONE\nDuplex: FULL,   Negotiation: DISABLE\nLast 300 seconds input rate 9840 bits/sec, 12 packets/sec\nLast 300 seconds output rate 11200 bits/sec, 13 packets/sec\nInput:  0 CRC, 0 Giants, 0 Runts\nOutput: 0 errors"},
    {c:["display current-configuration interface XGigabitEthernet0/0/1"], o:"#\ninterface XGigabitEthernet0/0/1\n description CORE-A-P-CEN-01-Te0/0/2\n mtu 1600\n ip address 10.0.0.3 255.255.255.254\n ospf network-type p2p\n ospf cost 10\n#\nreturn"},
    {c:["display ip routing-table protocol ospf"], o:"Route Flags: R - relay, D - download to fib\n------------------------------------------------------------------------------\nPublic routing table : OSPF\n         Destinations : 0        Routes : 0"},

const isIf=t=>/^(XGigabitEthernet|GigabitEthernet|TenGigabitEthernet|Eth-Trunk|LoopBack|Vlanif)\d/.test(t)||/^x\d+$/.test(t);
function normIf(s){
  s=s.toLowerCase(); const m=s.match(/^([a-z-]+)(\d[\d\/.:]*)$/); if(!m) return null;
  const p=m[1], n=m[2]; let k=null;
  if(p==="xge"||(p.length>=2&&p[0]==="x"&&"xgigabitethernet".startsWith(p))) k="xge";
  else if(p==="te"||(p.length>=2&&"tengigabitethernet".startsWith(p))) k="te";
  else if(p==="ge"||"gigabitethernet".startsWith(p)) k="ge";
  else if(p.length>=3&&"eth-trunk".startsWith(p)) k="eth-trunk";
  else if(p.length>=2&&"loopback".startsWith(p)) k="lo";
  else if(p.length>=5&&"vlanif".startsWith(p)) k="vlanif";
  else if(p==="x") k="x";
  else return null;
  return k+n;
}
function tokMatch(u,c){
  if(isIf(c)){const a=normIf(u),b=normIf(c);return !!a&&a===b}
  if(/[A-Z0-9]/.test(c)) return u===c;
  return u.length>0&&c.startsWith(u.toLowerCase());
}
const devObj=()=>S.sc.devices[S.dev];
const allCmds=d=>d.cmds.concat(GEN[d.os]);
function find(d,toks){
  let best=0, incomplete=false;
  for(const e of allCmds(d)) for(const c of e.c){
    const ct=c.split(" "); let k=0;
    while(k<toks.length&&k<ct.length&&tokMatch(toks[k],ct[k])) k++;
    if(k===toks.length&&k===ct.length) return {e,canon:e.c[0]};
    if(k===toks.length&&k<ct.length) incomplete=true;
    best=Math.max(best,k);
  }
  return {incomplete,best};
}
function nextTokens(d,typed,partial){
  const set=new Set();
  for(const e of allCmds(d)) for(const c of e.c){
    const ct=c.split(" "); if(ct.length<=typed.length) continue;
    let ok=true; for(let i=0;i<typed.length;i++){if(!tokMatch(typed[i],ct[i])){ok=false;break}}
    if(!ok) continue;
    const nx=ct[typed.length];
    if(!partial||nx.toLowerCase().startsWith(partial.toLowerCase())||(isIf(nx)&&normIf(partial+"0")&&normIf(nx).startsWith(normIf(partial+"0").replace(/0$/,"")))) set.add(nx);
  }
  return [...set];
}
const promptOf=d=>d.os==="huawei"?"<"+d.name+">":d.os==="cisco"?d.name+"#":d.name+" #";

/* =================== Consola =================== */
function out(text,cls){S.log.push({t:text,c:cls||""}); const o=document.getElementById("out"); if(o){const div=document.createElement("div"); if(cls) div.className=cls; div.textContent=text; o.appendChild(div); o.scrollTop=o.scrollHeight;}}
function caretErr(d,raw,pos){
  const pad=promptOf(d).length+pos;
  if(d.os==="huawei") return " ".repeat(pad)+"^\nError: Unrecognized command found at '^' position.";
  if(d.os==="cisco") return " ".repeat(pad)+"^\n% Invalid input detected at '^' marker.";
  return "command parse error before '"+raw.trim().split(/\s+/)[0]+"'\nCommand fail. Return code -61";
}
function applyFilter(text,f){
  const lines=text.split("\n"); let re;
  try{re=new RegExp(f.pat)}catch(e){re={test:s=>s.includes(f.pat)}}
  if(f.type==="include") return lines.filter(l=>re.test(l)).join("\n");
  if(f.type==="exclude") return lines.filter(l=>!re.test(l)).join("\n");
  if(f.type==="begin"){const i=lines.findIndex(l=>re.test(l));return i<0?"":lines.slice(i).join("\n")}
  if(f.type==="section"){const r=[];let on=false;for(const l of lines){if(!/^\s/.test(l)){on=re.test(l);if(on)r.push(l)}else if(on)r.push(l)}return r.join("\n")}
  return text;
}
function parseFilter(s,os){
  const m=s.trim().match(/^(\S+)\s+(.+)$/); if(!m) return null;
  const k=m[1].toLowerCase(), pat=m[2].trim();
  const types=os==="forti"?[["grep","include"]]:[["include","include"],["exclude","exclude"],["begin","begin"]].concat(os==="cisco"?[["section","section"]]:[]);
  for(const [w,t] of types) if(w.startsWith(k)) return {type:t,pat};
  return null;
}
const BLOCK=/^(sys|system-view|conf|configure|config|undo|shutdown|no|reset|reboot|reload|save|write|wr|copy|delete|format|interface|int|ip|router|ospf|set|edit|end|commit|execute\s+(reboot|factoryreset|shutdown))\b/i;

function record(canon){S.used[devObj().name+"|"+canon]=true}
function run(raw){
  const d=devObj(); out(promptOf(d)+raw,"cmd");
  let line=raw.replace(/\s+$/,""); if(!line.trim()) return;
  S.hist.push(raw); S.hpos=S.hist.length;
  if(line.endsWith("?")) return help(line.slice(0,-1));
  const low=line.trim().toLowerCase();
  if(low==="help") return help("");
  if(low==="clear"||low==="cls"){S.log=[];const o=document.getElementById("out");if(o)o.innerHTML="";return}
  if(["quit","exit","return","logout"].includes(low)) return out("[Laboratorio] Usa las pestañas de arriba para cambiar de equipo.","lab");
  let cmd=line, filt=null; const pi=line.indexOf("|");
  if(pi>=0){cmd=line.slice(0,pi); filt=parseFilter(line.slice(pi+1),d.os); if(!filt) return out(caretErr(d,line,pi+2),"err");}
  const toks=cmd.trim().split(/\s+/);
  if(d.os!=="forti"&&tokMatch(toks[0],"ping")&&toks[0].length>=2) { d.os==="huawei"?pingHw(d,toks.slice(1)):pingCi(d,toks.slice(1)); if(S.free) out(PING_INFO[d.os],"info"); return; }
  if(d.os==="forti"&&toks.length>=2&&tokMatch(toks[0],"execute")&&tokMatch(toks[1],"ping")) { pingFg(d,toks.slice(2)); if(S.free) out(PING_INFO.forti,"info"); return; }
  if(BLOCK.test(cmd.trim())&&!/^(display|show|get|dis|sh)\b/i.test(cmd.trim())) { out("[Laboratorio] Comando de configuración bloqueado: el N1 trabaja en solo lectura.","lab"); if(S.free){const ci=confInfo(cmd.trim()); if(ci) out(ci,"info");} return; }
  const r=find(d,toks);
  if(r.e){
    const id=d.name+"|"+r.canon; S.count[id]=(S.count[id]||0)+1; record(r.canon);
    let o=typeof r.e.o==="function"?r.e.o(S.count[id]):r.e.o;
    if(o==="__HIST") o=S.hist.slice(-20).join("\n");
    o=o.replace(/__NAME/g,d.name);
    if(filt) o=applyFilter(o,filt);
    out(o||" ");
    if(S.free){ if(r.e.i) out(infoText(r.e.i),"info"); if(filt) out(FILTER_INFO[filt.type],"info"); }
    return;
  }
  if(r.incomplete) return out(d.os==="huawei"?"Error: Incomplete command found at '^' position.":d.os==="cisco"?"% Incomplete command.":"command parse error: incomplete","err");
  let pos=0; const parts=cmd.split(/(\s+)/); let k=0; for(const p of parts){if(/^\s+$/.test(p)||p===""){pos+=p.length;continue} if(k===r.best)break; pos+=p.length;k++}
  out(caretErr(d,cmd,pos),"err");
  out(S.free?"[Práctica] Ese comando no está en el laboratorio o no es de este equipo. Escribe ? para ver la lista, o prueba en otra pestaña (Huawei, Cisco o FortiGate).":"[Laboratorio] Escribe ? para ver los comandos disponibles en este equipo.","dim");
}
function confInfo(c){
  const l=c.toLowerCase();
  const M=[[/^(sys|system-view)/,"system-view (Huawei): entra al modo de configuración. Cisco: configure terminal (conf t)."],[/^conf/,"configure terminal (Cisco): entra al modo de configuración. Huawei: system-view."],[/^save/,"save (Huawei): guarda la configuración para que no se pierda al reiniciar. Cisco: write memory."],[/^(wr|write)/,"write memory (Cisco): guarda la configuración. Huawei: save."],[/^undo/,"undo (Huawei): quita una línea de configuración. En Cisco se antepone no."],[/^no\b/,"no (Cisco): quita una línea de configuración. En Huawei se usa undo."],[/^shut/,"shutdown: apaga una interfaz. Corta el servicio."],[/^reset counters/,"reset counters interface <id> (Huawei): pone en cero los contadores de la interfaz. Cisco: clear counters <id>."],[/^clear counters/,"clear counters <id> (Cisco): pone en cero los contadores. Huawei: reset counters interface <id>."],[/^(reboot|reload)/,"reboot (Huawei) / reload (Cisco): reinicia el equipo. Corta todo el servicio."]];
  for(const [re,t] of M) if(re.test(l)) return "ⓘ "+t+"\n  El N1 no lo ejecuta en producción sin autorización.";
  return null;
}
function help(base){
  const d=devObj();
  if(!base.trim()){
    const list=allCmds(d).map(e=>"  "+e.c[0]);
    if(d.os==="huawei") list.push("  ping [-c n] [-s n] [-f] [-vpn-instance NOMBRE] <ip>");
    if(d.os==="cisco") list.push("  ping [vrf NOMBRE] <ip> [size n] [df-bit] [repeat n]");
    if(d.os==="forti") list.push("  execute ping <ip>");
    out("[Laboratorio] Comandos disponibles en "+d.name+" (se pueden abreviar):\n"+list.join("\n")+"\n  Filtros: "+(d.os==="forti"?"| grep <texto>":"| include / exclude / begin"+(d.os==="cisco"?" / section":"")+" <texto>"),"dim");
    return;
  }
  const endsSpace=/\s$/.test(base); const toks=base.trim().split(/\s+/);
  const typed=endsSpace?toks:toks.slice(0,-1); const partial=endsSpace?"":toks[toks.length-1];
  const nx=nextTokens(d,typed,partial);
  out(nx.length?nx.map(x=>"  "+x).join("\n")+(find(d,toks).e&&endsSpace?"\n  <cr>":""):(find(d,toks).e?"  <cr>":"  (sin opciones)"),"dim");
  const inp=document.getElementById("in"); if(inp){inp.value=base;inp.focus()}
}
function tab(){
  const inp=document.getElementById("in"); const v=inp.value; const d=devObj();
  const endsSpace=/\s$/.test(v); const toks=v.trim()?v.trim().split(/\s+/):[];
  const typed=endsSpace?toks:toks.slice(0,-1); const partial=endsSpace?"":(toks[toks.length-1]||"");
  const nx=nextTokens(d,typed,partial);
  if(nx.length===1){inp.value=typed.concat(nx[0]).join(" ")+" "}
  else if(nx.length>1){
    let cp=nx[0]; for(const x of nx){while(!x.toLowerCase().startsWith(cp.toLowerCase()))cp=cp.slice(0,-1)}
    out(promptOf(d)+v,"cmd"); out(nx.map(x=>"  "+x).join("\n"),"dim");
    if(cp.length>partial.length) inp.value=typed.concat(cp).join(" ");
  }
  inp.focus();
}

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const isIp=s=>/^\d{1,3}(\.\d{1,3}){3}$/.test(s);
function target(d,ip,vrf){return (d.pings||[]).find(p=>p.ip===ip&&(p.vrf||null)===(vrf||null))}
function pingHw(d,a){
  let c=5,s=56,df=false,vrf=null,ip=null;
  for(let i=0;i<a.length;i++){const t=a[i];
    if(t==="-c") c=parseInt(a[++i]); else if(t==="-s") s=parseInt(a[++i]); else if(t==="-f") df=true;
    else if(t==="-m"||t==="-t"||t==="-a"||t==="-i") i++;
    else if(t==="-vpn-instance") vrf=a[++i];
    else if(isIp(t)) ip=t; else return out("Error: Wrong parameter found at '^' position.","err");}
  if(!ip||isNaN(c)||isNaN(s)) return out("Error: Incomplete command found at '^' position.","err");
  if(vrf&&!(d.vrfs||[]).includes(vrf)) return out("Error: The VPN instance does not exist.","err");
  c=Math.max(1,Math.min(c,10000));
  const tg=target(d,ip,vrf), pkt=s+28, ok=!!tg&&(!df||pkt<=tg.mtu);
  markPing(df,ok,vrf);
  const L=["  PING "+ip+": "+s+"  data bytes, press CTRL_C to break"]; const show=Math.min(c,5); let mn=99,mx=0,sum=0;
  for(let i=1;i<=show;i++){ if(ok){const r=rnd(1,3);mn=Math.min(mn,r);mx=Math.max(mx,r);sum+=r;L.push("    Reply from "+ip+": bytes="+s+" Sequence="+i+" ttl=254 time="+r+" ms")} else L.push("    Request time out")}
  if(c>show) L.push("    ... [Laboratorio] se omiten "+(c-show)+" líneas iguales");
  L.push("","  --- "+ip+" ping statistics ---","    "+c+" packet(s) transmitted","    "+(ok?c:0)+" packet(s) received","    "+(ok?"0.00":"100.00")+"% packet loss");
  if(ok) L.push("    round-trip min/avg/max = "+mn+"/"+Math.round(sum/show)+"/"+mx+" ms");
  out(L.join("\n"));
}
function pingCi(d,a){
  let i=0,vrf=null; if(a[0]&&tokMatch(a[0],"vrf")){vrf=a[1];i=2}
  const ip=a[i++]; if(!ip||!isIp(ip)) return out("% Unrecognized host or address, or protocol not running.","err");
  let size=100,rep=5,df=false;
  for(;i<a.length;i++){const t=a[i];
    if(tokMatch(t,"size")) size=parseInt(a[++i]); else if(tokMatch(t,"repeat")) rep=parseInt(a[++i]);
    else if(tokMatch(t,"df-bit")) df=true; else if(tokMatch(t,"source")||tokMatch(t,"timeout")) i++;
    else return out("% Invalid input detected at '^' marker.","err");}
  if(vrf&&!(d.vrfs||[]).includes(vrf)) return out("% VRF "+vrf+" is not configured","err");
  const tg=target(d,ip,vrf), ok=!!tg&&(!df||size<=tg.mtu); markPing(df,ok,vrf);
  const n=Math.min(rep,100); const r1=rnd(1,2),r2=r1+rnd(0,2);
  out("Type escape sequence to abort.\nSending "+rep+", "+size+"-byte ICMP Echos to "+ip+", timeout is 2 seconds:"+(df?"\nPacket sent with the DF bit set":"")+"\n"+(ok?"!":".").repeat(n)+(rep>100?"...":"")+"\nSuccess rate is "+(ok?100:0)+" percent ("+(ok?rep:0)+"/"+rep+")"+(ok?", round-trip min/avg/max = "+r1+"/"+r1+"/"+r2+" ms":""));
}
function pingFg(d,a){
  const ip=a.find(isIp); if(!ip) return out("command parse error before 'ping'","err");
  const ok=!!target(d,ip,null); const L=["PING "+ip+" ("+ip+"): 56 data bytes"];
  for(let i=0;i<5;i++) if(ok) L.push("64 bytes from "+ip+": icmp_seq="+i+" ttl=255 time=0."+rnd(3,9)+" ms");
  L.push("","--- "+ip+" ping statistics ---","5 packets transmitted, "+(ok?5:0)+" packets received, "+(ok?0:100)+"% packet loss"); if(ok) L.push("round-trip min/avg/max = 0.3/0.5/0.9 ms");
  out(L.join("\n"));
}
function markPing(df,ok,vrf){ if(vrf&&ok) record("__ping_vrf"); if(df&&!ok) record("__ping_df_fail"); if(df&&ok) record("__ping_df_ok"); }

/* =================== Vistas =================== */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const OSN={huawei:"Huawei",cisco:"Cisco",forti:"FortiGate"};
function listView(){
  const solved=SC.filter(s=>P.done[s.id]&&P.done[s.id].ok).length;
  return `<header class="brand"><div class="leds" aria-hidden="true"><i></i><i></i><i></i></div><h1>Laboratorio CLI CNOC</h1></header>
  <p class="sub">Consola simulada para practicar el diagnóstico del N1. ${SC.length} casos, ${solved} resueltos. Todos los equipos, IP y clientes son ficticios.</p>
  <section class="panel"><span class="label">Cómo se usa</span><ul>
   <li>Lee el ticket, entra a cada equipo con las pestañas y escribe comandos como en el equipo real.</li>
   <li>Puedes abreviar: <code>dis ospf peer br</code>, <code>sh ip ospf nei</code>, <code>dis int g0/0/3</code>.</li>
   <li><code>?</code> muestra los comandos; <b>Tab</b> completa; ↑ repite el anterior. Filtros: <code>| include</code>, <code>| begin</code>.</li>
   <li>Cuando tengas la causa, toca <b>Diagnosticar</b>. Al final ves qué comandos clave usaste.</li>
   <li>Los comandos de configuración están bloqueados: el N1 trabaja en solo lectura.</li></ul></section>
  <button class="sc free" data-act="free"><span class="n">PRÁCTICA LIBRE · 5 EQUIPOS</span><strong>Escribe un comando y te digo qué muestra y para qué sirve</strong><span class="n">Huawei, Cisco y FortiGate con una red sana</span></button>
  <span class="label">Casos de diagnóstico</span>
  <div class="cards">${SC.map((s,i)=>{const d=P.done[s.id];return `<button class="sc" data-act="open" data-i="${i}"><span class="n">CASO ${String(i+1).padStart(2,"0")} · ${esc(s.level)}</span><strong>${esc(s.title)}</strong><span class="meta">${[...new Set(s.devices.map(x=>OSN[x.os]))].map(o=>`<span class="pill">${o}</span>`).join("")}${d?`<span class="pill ${d.ok?"ok":"bad"}">${d.ok?"Resuelto":"Repasar"}</span>`:""}</span></button>`}).join("")}</div>
  <p class="foot">El progreso se guarda solo en este navegador.</p>`;
}
function labView(){
  const s=S.sc, d=devObj();
  return `<div class="top"><button class="link" data-act="back">← Inicio</button><span class="label">${S.free?"Práctica libre":esc(s.level)}</span></div>
  ${S.free?`<section class="panel"><h2>Práctica libre</h2><p class="sub">Escribe cualquier comando de lectura (puedes abreviarlo). Te devuelvo la salida y, en azul, para qué sirve, qué mirar y su equivalente en la otra marca. Toca <b>Ideas</b> si no sabes qué probar.</p></section>`:`<section class="panel"><h2>${esc(s.title)}</h2><div class="ticket"><span class="label">Ticket</span><p>${esc(s.ticket)}</p><p><b>Objetivo:</b> ${esc(s.goal)}</p></div></section>`}
  <div class="tabs" role="group" aria-label="Equipos">${s.devices.map((x,i)=>`<button class="tab" data-act="dev" data-i="${i}" aria-pressed="${i===S.dev}">${esc(x.name)}<small>${esc(x.role)}</small></button>`).join("")}</div>
  <div class="term">
    <div class="out" id="out" aria-live="polite"></div>
    <form class="inrow" id="form" autocomplete="off"><span class="prompt" id="prompt">${esc(promptOf(d))}</span>
      <input id="in" type="text" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" aria-label="Comando">
      <button class="send" type="submit">Enter</button></form>
    <div class="keys">
      <button class="key" data-act="k-up" aria-label="Comando anterior">↑</button>
      <button class="key" data-act="k-tab">Tab</button>
      <button class="key" data-act="k-ins" data-v="?">?</button>
      <button class="key" data-act="k-ins" data-v=" | ">|</button>
      <button class="key" data-act="k-hint">${S.free?"Ideas":"Pista"}</button>
      <button class="key" data-act="k-clear">Limpiar</button>
    </div>
  </div>
  ${S.free?"":`<section class="panel" id="diag">${diagView()}</section>`}`;
}
function diagView(){
  const s=S.sc;
  if(S.answered===null && !S.showQ) return `<div class="row"><button class="btn primary" data-act="ask">Diagnosticar</button></div><span class="foot">Investiga primero en los equipos. Puedes pedir pistas en la consola.</span>`;
  const ord=S.order; const ans=S.answered!==null;
  const okA=ans&&S.answered===s.q.correct;
  let h=`<p class="q">${esc(s.q.text)}</p><div class="opts">${ord.map(i=>{let cls="opt"; if(ans){if(i===s.q.correct)cls+=" ok";else if(i===S.answered)cls+=" bad";else cls+=" dim"} return `<button class="${cls}" data-act="pick" data-i="${i}" ${ans?'aria-disabled="true"':""}><span class="port"></span><span>${esc(s.q.options[i])}</span></button>`}).join("")}</div>`;
  if(ans){
    h+=`<div class="fb ${okA?"ok":"bad"}"><b class="t">${okA?"Diagnóstico correcto":"No es esa"}</b><p>${esc(s.q.explain)}</p>
    <span class="label">Comandos clave</span><ul class="checks">${s.keys.map(k=>{const u=k.any.some(c=>S.used[k.dev+"|"+c]);return `<li><span class="mk ${u?"y":"n2"}">${u?"✓":"✗"}</span><span>${esc(k.label)} <span class="foot">(${esc(k.dev)})</span></span></li>`}).join("")}</ul></div>
    <div class="row"><button class="btn primary" data-act="next">Siguiente caso</button><button class="btn" data-act="retry">Repetir este</button></div>`;
  }
  return h;
}
function render(){
  const app=document.getElementById("app");
  app.innerHTML=S.view==="list"?listView():labView();
  if(S.view==="lab"){
    const o=document.getElementById("out"); for(const l of S.log){const div=document.createElement("div");if(l.c)div.className=l.c;div.textContent=l.t;o.appendChild(div)} o.scrollTop=o.scrollHeight;
    document.getElementById("form").addEventListener("submit",e=>{e.preventDefault();const i=document.getElementById("in");const v=i.value;i.value="";run(v);i.focus()});
    document.getElementById("in").addEventListener("keydown",keys);
  }
}
function keys(e){
  const i=e.target;
  if(e.key==="Tab"){e.preventDefault();tab()}
  else if(e.key==="ArrowUp"){e.preventDefault();if(S.hpos>0){S.hpos--;i.value=S.hist[S.hpos]}}
  else if(e.key==="ArrowDown"){e.preventDefault();if(S.hpos<S.hist.length-1){S.hpos++;i.value=S.hist[S.hpos]}else{S.hpos=S.hist.length;i.value=""}}
  else if(e.key==="?"){e.preventDefault();const v=i.value;i.value="";out(promptOf(devObj())+v+"?","cmd");help(v)}
}
function banner(){const d=devObj();out("--- Conectado a "+d.name+" ("+d.role+") ---","ban");out("[Laboratorio] Escribe ? para ver los comandos. Todo es ficticio.","dim")}
function openFree(){
  S.free=true; S.sc=FREE; S.dev=0; S.log=[]; S.hist=[]; S.hpos=0; S.used={}; S.count={}; S.answered=null;
  S.view="lab"; banner(); render(); window.scrollTo(0,0);
}
function openSc(i){
  S.free=false; S.sc=SC[i]; S.dev=0; S.log=[]; S.hist=[]; S.hpos=0; S.used={}; S.count={}; S.hint=0; S.answered=null; S.showQ=false;
  S.order=[...S.sc.q.options.keys()].sort(()=>Math.random()-.5);
  S.view="lab"; banner(); render(); window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return; const a=b.dataset.act, i=b.dataset.i!==undefined?+b.dataset.i:null;
  if(a==="open") openSc(i);
  else if(a==="free") openFree();
  else if(a==="back"){S.view="list";render();window.scrollTo(0,0)}
  else if(a==="dev"){if(i===S.dev)return;S.dev=i;banner();document.querySelectorAll(".tab").forEach((t,k)=>t.setAttribute("aria-pressed",k===i));document.getElementById("prompt").textContent=promptOf(devObj());document.getElementById("in").focus()}
  else if(a==="k-up"){const inp=document.getElementById("in");if(S.hpos>0){S.hpos--;inp.value=S.hist[S.hpos]}inp.focus()}
  else if(a==="k-tab") tab();
  else if(a==="k-ins"){const inp=document.getElementById("in"); if(b.dataset.v==="?"){const v=inp.value;inp.value="";out(promptOf(devObj())+v+"?","cmd");help(v)} else {inp.value+=b.dataset.v;inp.focus()}}
  else if(a==="k-hint"&&S.free){const d=devObj();const pool=allCmds(d).map(e=>e.c[0]).sort(()=>Math.random()-.5).slice(0,4);out("[Ideas para "+d.name+"] Prueba:\n"+pool.map(x=>"  "+x).join("\n")+"\n  ping <ip>  ·  agrega | include <texto> a cualquier comando","hint")}
  else if(a==="k-hint"){const h=S.sc.hints; out(S.hint<h.length?"[Pista "+(S.hint+1)+"/"+h.length+"] "+h[S.hint++]:"[Pista] Ya viste todas. Toca Diagnosticar cuando tengas la causa.","hint")}
  else if(a==="k-clear"){S.log=[];document.getElementById("out").innerHTML=""}
  else if(a==="ask"){S.showQ=true;document.getElementById("diag").innerHTML=diagView();document.getElementById("diag").scrollIntoView({block:"start",behavior:"smooth"})}
  else if(a==="pick"){if(S.answered!==null)return;S.answered=i;const ok=i===S.sc.q.correct;P.done[S.sc.id]={ok};save();document.getElementById("diag").innerHTML=diagView()}
  else if(a==="next"){const k=SC.indexOf(S.sc);openSc((k+1)%SC.length)}
  else if(a==="retry") openSc(SC.indexOf(S.sc));
});
render();
</script>
